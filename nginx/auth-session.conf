# nginx integration for nginx-ldap-auth with the login form enabled.
#
# This is the variant to use when `session.enabled: true` is set. The difference
# from auth.conf is three things:
#
#   1. two ordinary locations, /login and /logout, proxied to the service — the
#      browser reaches these directly, not through auth_request;
#   2. a redirect from the 401 to the login form, instead of the browser's own
#      password dialog;
#   3. Set-Cookie from the auth subrequest copied onto the response, which is
#      what keeps the idle window sliding.
#
# Point 3 is the one that is easy to miss and hard to diagnose. nginx discards
# the response headers of an auth_request, so without the two lines that copy it
# out, a session still works — it just stops sliding, and everyone is logged out
# at the absolute timeout no matter how busy they were.

limit_req_zone $binary_remote_addr zone=nginx_ldap_auth:10m rate=20r/s;

# The service's address, in one place.
#
# It is referenced from three locations below — /auth, /login and /logout — and
# they have to agree. When they do not, the odd one out proxies to whatever else
# happens to listen on the port that was left behind: usually the application
# itself, which answers 404 for a path it has never heard of, while the service
# log stays empty because nothing ever reached it.
#
# Change the port here and nowhere else.
upstream nginx_ldap_auth {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    server_name intranet.example.org;

    # The session cookie is issued with the Secure attribute, so it is only
    # ever sent back over TLS. Serving this over plain HTTP means no session
    # cookie ever arrives and every request lands on the login form.
    ssl_certificate     /etc/ssl/certs/intranet.example.org.pem;
    ssl_certificate_key /etc/ssl/private/intranet.example.org.key;

    location / {
        limit_req zone=nginx_ldap_auth burst=50 nodelay;

        auth_request /_auth;

        # Pass the authenticated identity to the application. Setting both
        # headers unconditionally is what stops a client from supplying its
        # own X-Remote-User.
        auth_request_set $auth_user   $upstream_http_x_auth_user;
        auth_request_set $auth_groups $upstream_http_x_auth_groups;

        proxy_set_header X-Remote-User   $auth_user;
        proxy_set_header X-Remote-Groups $auth_groups;

        # The sliding idle window. The service re-issues the cookie once its
        # last-seen stamp is older than session.refresh_interval, and this is
        # what carries that Set-Cookie back to the browser. nginx skips an
        # add_header whose value is empty, so on the requests in between —
        # which is most of them — nothing is added.
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        # Where to send a visitor who has no session. The service puts the
        # address in a header rather than it being written down here as well,
        # so that session.login_path is configured in exactly one place.
        auth_request_set $auth_login $upstream_http_x_auth_login_url;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:3000;
    }

    location @login_redirect {
        # $auth_login is empty whenever the service answered the 401 without
        # the header, and the one thing that produces that is sessions being
        # switched off — a config file where session.enabled is still false,
        # or a service that was not restarted after it was set.
        #
        # Without this guard nginx would send "Location:" with nothing after
        # it, the browser would re-request the same address, and the log would
        # fill with 302s for every asset on the page while nothing ever loads.
        # Refusing plainly is the honest answer: it says authentication is
        # required and stops.
        if ($auth_login = "") {
            return 401 "sessions are not enabled on nginx-ldap-auth\n";
        }

        # 302, not 301: the browser must ask again after logging in rather
        # than remembering that this URL means "go to the login page".
        return 302 $auth_login;
    }

    location = /_auth {
        internal;

        proxy_pass http://nginx_ldap_auth/auth;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Auth-Policy intranet;

        # The session cookie, the credentials of a client that cannot hold one,
        # and the real client address the throttle counts against.
        proxy_set_header Cookie        $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP     $remote_addr;

        # The address the visitor actually asked for. It becomes the ?next=
        # parameter on the login redirect, so that logging in returns them to
        # the page they wanted instead of to the site root.
        proxy_set_header X-Original-URI $request_uri;
    }

    # The login form. A real location, not an internal one: the browser loads
    # it, submits it, and is redirected back by the service.
    #
    # It must NOT carry auth_request. A login form behind the authentication it
    # exists to perform answers 401, which redirects to itself, which answers
    # 401 — and the browser gives up after twenty round trips.
    #
    # It also has to sit at the server level, next to the protected location
    # rather than inside it. When the application lives under a prefix — say
    # `location /admin` — a bare `location = /login` is still correct and still
    # reachable, but it has to exist: without it the request falls through to
    # whatever handles `/`, which is usually the application, and the
    # application answers 404 for a path it has never heard of.
    location = /login {
        limit_req zone=nginx_ldap_auth burst=10 nodelay;

        proxy_pass http://nginx_ldap_auth/login;

        # Same policy as the location it protects. Without it the service falls
        # back to default_policy, and a form shown for the wrong policy issues
        # a session that the protected location will refuse.
        proxy_set_header X-Auth-Policy intranet;

        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        proxy_pass http://nginx_ldap_auth/logout;

        proxy_set_header X-Auth-Policy intranet;
        proxy_set_header Host          $host;
        proxy_set_header X-Real-IP     $remote_addr;
    }
}

# ---------------------------------------------------------------------------
# When it does not work
#
# Check the service directly first, with nginx out of the way. Everything below
# assumes the service listens on 127.0.0.1:8080.
#
#   curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/login
#
# 404 from that command means the service is not serving a login form at all:
# session.enabled is still false, or the unit was not restarted after it was
# set. `systemctl restart nginx-ldap-auth` and look for the startup record —
# it says either "sessions enabled" with both timeouts, or "sessions disabled".
#
# 200 from that command and a 404 through nginx means the request never reached
# the service. Either `location = /login` is missing from the server block that
# serves the site, or its proxy_pass names the wrong port — in both cases the
# request lands on the application, which answers 404. The service log stays
# empty, which is the thing that tells the two apart from a service that
# answered badly: a request that arrived always leaves a record, and successful
# decisions are recorded at debug level, so set logging.level to debug before
# concluding that nothing arrived.
#
# A log full of 302s for assets — fonts, stylesheets, images under the
# application's own prefix — is the redirect loop the guard in @login_redirect
# now refuses. Every asset request is its own auth_request, so an unauthenticated
# page turn produces one redirect per asset. After a successful login they stop.
#
# A browser password dialog instead of the form means the 401 still carries
# WWW-Authenticate, which the service only sends while sessions are disabled.
# Same cause as the 404 above, same fix.
# ---------------------------------------------------------------------------
