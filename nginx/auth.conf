# nginx integration for nginx-ldap-auth.
#
# Include the internal location once per server block, then add auth_request to
# every location that should require credentials.
#
# The auth_request module is part of the standard nginx build on Arch Linux; no
# third-party module and no rebuild is involved.

# Per-address request limiting. This is the cheap first line of defence and it
# is complementary to the service's own throttle: nginx limits request volume
# per address, the service limits failures per identity.
#
# Tune the rate to the application's normal traffic. An asset-heavy page can
# issue dozens of requests per view, and every one of them is an auth_request.
limit_req_zone $binary_remote_addr zone=nginx_ldap_auth:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name intranet.example.org;

    # Basic Authentication sends the password on every request. It must never
    # travel over plaintext HTTP.
    ssl_certificate     /etc/ssl/certs/intranet.example.org.pem;
    ssl_certificate_key /etc/ssl/private/intranet.example.org.key;

    location / {
        limit_req zone=nginx_ldap_auth burst=50 nodelay;

        auth_request /_auth;

        # Pass the authenticated identity to the application. Setting both
        # headers unconditionally is what stops a client from supplying its
        # own X-Remote-User.
        auth_request_set $auth_user   $upstream_http_x_auth_user;
        auth_request_set $auth_groups $upstream_http_x_auth_groups;

        proxy_set_header X-Remote-User   $auth_user;
        proxy_set_header X-Remote-Groups $auth_groups;

        proxy_pass http://127.0.0.1:3000;
    }

    location = /_auth {
        internal;

        proxy_pass http://127.0.0.1:8080/auth;

        # The authentication decision needs no body, and forwarding one would
        # mean every upload is sent twice.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Which policy applies. Without this the service falls back to
        # default_policy, and refuses the request if none is configured.
        proxy_set_header X-Auth-Policy intranet;

        # The credentials, and the real client address the throttle counts
        # against. Without X-Real-IP every request looks like it came from
        # nginx, and the per-address limit becomes one shared budget.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP     $remote_addr;

        # For the service's log record, so a refusal can be traced back to the
        # URL that triggered it.
        proxy_set_header X-Original-URI $request_uri;
    }
}
