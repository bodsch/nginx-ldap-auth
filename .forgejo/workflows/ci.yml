# Forgejo Actions CI — runs on every push to main and every pull request.
#
# Every step is a `make` target, so the same checks run locally and here. This
# follows the house style of the sibling Go services (mailcow-netfilter and
# friends).
#
# Prerequisites on the Forgejo instance:
#   - Actions enabled for the repo (Settings → Actions).
#   - A registered runner whose labels include `ubuntu-latest` (adjust `runs-on`
#     below to match your runner, e.g. `docker`).
#   - The default actions registry reachable (checkout/setup-go are mirrored on
#     code.forgejo.org, Forgejo's default DEFAULT_ACTIONS_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint (incl. gosec)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: govulncheck
        run: make vuln

      - name: Test (race detector)
        run: make test

      # The integration suite runs a real GLAuth as a separate process. It is
      # not a module dependency, so it is installed here rather than vendored —
      # and it is a separate step so that a failure says "the directory
      # integration broke", not "the tests broke".
      - name: Install GLAuth
        run: go install github.com/glauth/glauth/v2@latest

      - name: Integration suite (real GLAuth directory)
        run: make test-integration

      - name: Build
        run: make build

      # A configuration file that the shipped example cannot even load would be
      # a broken package. The secrets the example references do not exist in CI,
      # so they are created first — with throwaway values, which is all --check
      # needs.
      - name: Validate the example configuration
        run: |
          set -eu
          tmp="$(mktemp -d)"
          # The loader warns about a secret file readable beyond its owner and
          # group, and it is right to. Creating them correctly here keeps the
          # step's output to the answer it was run for.
          umask 027
          openssl rand -hex 32 > "$tmp/cache-pepper.secret"
          printf 'servicepassword' > "$tmp/ldap-bind.secret"
          sed -e "s#/etc/nginx-ldap-auth/cache-pepper.secret#$tmp/cache-pepper.secret#" \
              -e "s#/etc/nginx-ldap-auth/ldap-bind.secret#$tmp/ldap-bind.secret#" \
              config.example.yaml > "$tmp/config.yaml"
          ./bin/nginx-ldap-auth --check --config "$tmp/config.yaml"
