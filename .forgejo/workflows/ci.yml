# Forgejo Actions CI — runs on every push to main and every pull request.
#
# Every step is a `make` target, so the same checks run locally and here. This
# follows the house style of the sibling Go services (mailcow-netfilter and
# friends).
#
# Prerequisites on the Forgejo instance:
#   - Actions enabled for the repo (Settings → Actions).
#   - A registered runner whose labels include `ubuntu-latest` (adjust `runs-on`
#     below to match your runner, e.g. `docker`).
#   - The default actions registry reachable (checkout/setup-go are mirrored on
#     code.forgejo.org, Forgejo's default DEFAULT_ACTIONS_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      # Through make, like every other step. This one used to install and
      # invoke the linter inline with its own pinned version — which is how the
      # pin drifted from the one a developer runs locally, and how a linter
      # older than the Go toolchain got into CI and panicked instead of
      # reporting findings. The version now has one definition, in the Makefile.
      - name: golangci-lint (incl. gosec)
        run: |
          make lint-install
          make lint

      - name: govulncheck
        run: make vuln

      - name: Test (race detector)
        run: make test

      # The integration suite runs a real GLAuth as a separate process. It is
      # not a module dependency, so it is installed rather than vendored — and
      # it is a separate step so that a failure says "the directory integration
      # broke", not "the tests broke".
      - name: Install GLAuth
        run: make glauth-install

      - name: Integration suite (real GLAuth directory)
        run: make test-integration

      - name: Build
        run: make build

      # A shipped example configuration that cannot even be loaded would be a
      # broken package.
      - name: Validate the example configuration
        run: make check-example
