# nginx-ldap-auth configuration.
#
# Copy to /etc/nginx-ldap-auth/config.yaml and adjust. Every key shown here has
# the value the service uses when it is omitted, unless marked otherwise, so a
# working configuration can be much shorter than this file.
#
# Check a file without starting the service:
#   nginx-ldap-auth --check --config /etc/nginx-ldap-auth/config.yaml

server:
  # Loopback only. The authentication endpoint must not be reachable by
  # clients: it is a password oracle against the directory, and it trusts the
  # client address header below.
  listen: 127.0.0.1:8080

  # Header carrying the real client address. Behind nginx every request comes
  # from the proxy, so without this the per-address throttle counts the whole
  # internet as one client. nginx has to set it:
  #   proxy_set_header X-Real-IP $remote_addr;
  # Clear it to fall back to the peer address.
  client_ip_header: X-Real-IP

  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  shutdown_timeout: 10s
  max_header_bytes: 8192

# Selected when a request carries no X-Auth-Policy header. Leave it out to
# require every nginx location to name its policy explicitly.
default_policy: intranet

# A policy is what lets one instance serve several applications: it bundles the
# realm, the directory and the authorization rules that apply to one of them.
policies:
  intranet:
    realm: "Intranet"
    ldap: primary

    # Access requires membership in at least one of these. Both the full DN and
    # the short name are accepted, and both are compared case-insensitively.
    #
    # The short name is the portable choice. A full DN has to match the RDN
    # attribute the directory actually uses, and that varies: GLAuth names
    # groups ou=web-users,ou=groups,... while an OpenLDAP posixGroup would be
    # cn=web-users,ou=groups,... A short name matches either.
    require_groups:
      - web-users

  monitoring:
    realm: "Monitoring"
    ldap: primary
    require_groups:
      - cn=ops,ou=groups,dc=example,dc=org

  # Authentication without authorization has to be stated, so that it cannot
  # happen by forgetting require_groups.
  # staging:
  #   realm: "Staging"
  #   ldap: primary
  #   allow_any_user: true

ldap:
  primary:
    url: ldaps://glauth.example.org:636
    base_dn: dc=example,dc=org

    # Exactly one %s, filled with the escaped login name.
    user_filter: "(uid=%s)"

    # The attribute holding the canonical login name. Its value, not what the
    # client typed, is what reaches the upstream application.
    user_attribute: uid

    # Group resolution. Use group_filter for member-style schemas, or
    # group_attribute for memberOf schemas — one or the other, never both.
    #
    # These values are the ones that work against GLAuth, verified by the
    # integration suite. GLAuth exposes groups as groupOfUniqueNames with a
    # uniqueMember attribute holding full DNs; it does not expose posixGroup or
    # memberUid, so the filter every other example uses matches nothing there.
    group_base_dn: ou=groups,dc=example,dc=org
    group_filter: "(&(objectClass=groupOfUniqueNames)(uniqueMember=%s))"

    # What %s in group_filter is filled with: "user" or "dn".
    group_filter_value: dn

    # The attribute reported as the group's name.
    group_name_attribute: cn

    # For OpenLDAP with posixGroup, which stores login names rather than DNs:
    # group_filter: "(&(objectClass=posixGroup)(memberUid=%s))"
    # group_filter_value: user

    # memberOf style alternative, which works against GLAuth too:
    # group_attribute: memberOf

    # Service account for the user and group searches. Both keys or neither;
    # neither means anonymous search.
    bind_dn: cn=serviceuser,dc=example,dc=org
    bind_password_file: /etc/nginx-ldap-auth/ldap-bind.secret

    bind_timeout: 5s
    operation_timeout: 5s

    tls:
      # Defaults to true. Setting it to false accepts any certificate, which
      # means anyone able to intercept the connection can collect credentials.
      verify: true

      # For a directory using a private CA.
      # ca_file: /etc/ssl/certs/internal-ca.pem

      # Upgrade a plaintext ldap:// connection. Not for ldaps://, which is
      # already TLS from the first byte.
      # start_tls: false

# Login form and signed session cookie.
#
# Without this the service uses HTTP Basic Authentication alone, which has no
# logout and no expiry: the browser keeps replaying the credentials until it is
# closed, so a login survives days of inactivity.
#
# With it, a successful login sets a signed cookie that expires on its own, and
# /logout ends it. The cookie carries the decision, never the password.
#
# Enabling this needs three things: a secret file, the two extra locations in
# the nginx configuration (see examples/auth-session.conf), and a restart.
session:
  enabled: false

  # Signs the cookie. Required while sessions are enabled — an unsigned cookie
  # is a request parameter, and a visitor could name any user in any group.
  # Generate once, per installation, and keep it out of travelling backups:
  #   openssl rand -hex 32 > /etc/nginx-ldap-auth/session.secret
  #   chmod 0640 /etc/nginx-ldap-auth/session.secret
  #
  # Replacing it ends every session immediately, which is the closest thing to
  # a "log everybody out" button this service has.
  secret_file: /etc/nginx-ldap-auth/session.secret

  # Maximum lifetime, counted from the login and never extended. A session in
  # constant use still ends here.
  #
  # This is the only bound on a cookie that has been copied: there is no
  # server-side session table to delete it from, so it stays usable until this
  # expires, even after the account is disabled in the directory.
  absolute_timeout: 8h

  # How long a session survives without being used.
  idle_timeout: 30m

  # How old the cookie's last-seen stamp has to be before it is re-issued.
  # nginx makes one authentication subrequest per HTTP request, so refreshing
  # on every one of them would put a Set-Cookie on every image on every page.
  refresh_interval: 5m

  # Two services on the same domain need two different names, or each will
  # overwrite the other's session.
  cookie_name: nginx_ldap_auth
  cookie_path: /

  # Leave empty to bind the cookie to the exact host that set it. Any value at
  # all also sends it to every subdomain, including ones this service does not
  # protect.
  # cookie_domain: ""

  # Keeps the cookie off plaintext HTTP. Only turn this off for a local test
  # setup without TLS — on a real deployment it lets anyone on the path copy
  # the session.
  secure: true

  # lax, strict or none. Lax is what lets a link from another site land on a
  # page the user is already signed in to.
  same_site: lax

  # Served by this service, proxied by nginx. Unlike /auth these are reached by
  # the browser directly.
  login_path: /login
  logout_path: /logout

  # Replaces the built-in form. An html/template, parsed at startup, rendered
  # with .Realm .Policy .Action .Next .CSRFToken .Username .Error .Decoration
  # login_template: /etc/nginx-ldap-auth/login.html

  # Keeps HTTP Basic Authentication working for curl, monitoring checks and API
  # clients. Browsers are never challenged with it while sessions are enabled:
  # a WWW-Authenticate header would make the browser open its own password
  # dialog instead of following the redirect to the login form, and the
  # credentials it caches there would be back to never expiring.
  allow_basic: true

cache:
  # nginx issues one authentication request per HTTP request, including every
  # static asset. Without the cache a single page view becomes dozens of LDAP
  # binds.
  enabled: true
  ttl: 60s

  # Caching failures reduces the load a brute-force attempt puts on the
  # directory, but it also delays a corrected password. Off by default.
  negative_ttl: 0s

  # Bounds the cache. This stops a spray of invalid usernames from growing the
  # process, so it is a security control and not only a memory setting.
  max_entries: 10000

  # Keys the HMAC that derives cache keys from credentials. Required while the
  # cache is enabled: an unkeyed hash of a password is crackable offline.
  # Generate once, keep out of backups that travel:
  #   openssl rand -hex 32 > /etc/nginx-ldap-auth/cache-pepper.secret
  #   chmod 0640 /etc/nginx-ldap-auth/cache-pepper.secret
  pepper_file: /etc/nginx-ldap-auth/cache-pepper.secret

# Shared decision cache, for several instances that should see each other's
# decisions. It replaces the in-process cache rather than sitting behind it: a
# memory tier in front of Redis would keep serving a decision another instance
# had already revoked, which defeats the only reason to share them.
#
# For a single service this is strictly worse than the default — a network hop
# per request and a second daemon to keep alive — so leave it off unless you
# actually run more than one instance.
#
# Keep the timeout well below the directory's operation_timeout. A cache slower
# than the lookup it spares costs the timeout and then does the lookup anyway.
#
# The database holds credential-derived keys and authorization decisions, so it
# should require authentication and should not be shared with other users of
# the same Redis.
redis:
  enabled: false
  address: 127.0.0.1:6379
  database: 3
  timeout: 1s
  # password_file: /etc/nginx-ldap-auth/redis.secret

# Failure throttle. Counts failures per username and per source address, and
# answers 429 without touching the directory once a limit is reached.
#
# This is not a replacement for limit_req in nginx: nginx limits request volume
# per address, this limits failures per identity.
rate_limit:
  enabled: true
  window: 1m
  max_failures_per_user: 10
  max_failures_per_ip: 30
  block_duration: 5m
  max_entries: 10000

logging:
  # debug logs every successful authentication, which on a busy site is one
  # line per HTTP request.
  level: info
  format: json

  # Login names in log records. Needed to investigate a lockout; turn off if
  # the journal is readable by people who should not see them.
  log_username: true

# Prometheus/OpenMetrics exposition, on its own listener so that it can be
# firewalled separately from the authentication endpoint: nginx needs one of
# them, the monitoring system needs the other, and those are different sets.
#
# The exposition names your policies and carries failure counts. Keep it on
# loopback, or reachable from the monitoring network only.
metrics:
  enabled: true
  address: 127.0.0.1:9931
